name: 每日更新 ETF 数据

# 保守写法：只保留必需字段，先确保 GitHub 能登记这个 workflow，
# 后续需要再逐步加回 concurrency / 失败通知 等增强项。
on:
  schedule:
    - cron: '10 15 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: server/.cache
          key: etf-cache-${{ github.run_id }}
          restore-keys: etf-cache-

      - name: 数据源连通性
        continue-on-error: true
        run: |
          set +e
          check() {
            code=$(curl -s -o /dev/null -m 12 -A "Mozilla/5.0" -w "%{http_code}" "$@")
            echo "$code  ${!#}"
          }
          check "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.510300&fields1=f1&fields2=f51,f53&klt=101&fqt=1&beg=20261101&end=20261123"
          check "https://www.cffex.com.cn/sj/ccpm/202611/20/IH.xml"
          check "https://www.szse.cn/api/report/ShowReport?SHOWTYPE=xlsx&CATALOGID=scsj_fund_jjgm&txtQueryDate=2026-11-20"
          check -H "Referer: https://www.sse.com.cn/" "https://query.sse.com.cn/commonQuery.do?sqlId=COMMON_SSE_ZQPZ_ETFZL_XXPL_ETFGM_SEARCH_L&TRADE_DATE=2026-11-20"
          exit 0

      - name: 生成快照
        id: build
        run: TZ=Asia/Shanghai node tools/ci-build.js --out dist

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: data.kaciry.com
          force_orphan: true
