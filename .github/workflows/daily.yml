name: 每日更新 ETF 数据

# 保守写法：只保留必需字段，先确保 GitHub 能登记这个 workflow，
# 后续需要再逐步加回 concurrency / 失败通知 等增强项。
on:
  schedule:
    - cron: '10 15 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: server/.cache
          key: etf-cache-${{ github.run_id }}
          restore-keys: etf-cache-

      - name: 生成快照
        id: build
        run: TZ=Asia/Shanghai node tools/ci-build.js --out dist

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: data.kaciry.com
          force_orphan: true
